[project]
name = "rag-python"
version = "1.0.0"
description = "RAG AI assistant (FastAPI) - semantic search only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=5.21.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.0",
    "langchain-cohere>=0.6.0",
    "langchain-google-genai>=4.4.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "mangum>=0.17.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.53.0",
]

# Ye ek script-style project hai (src layout nahi), isliye uv isko
# package ke tor par build/install nahi karega - sirf dependencies install karega.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
