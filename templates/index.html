<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Base RAG — Chat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/>
          <path d="M19 15l.9 2.4L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.6z" opacity=".75"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Knowledge Base <span class="gradient-text">RAG</span></h1>
        <p>Upload a PDF, TXT or MD file — then ask anything about it.</p>
      </div>
      <div class="online-badge"><span class="dot"></span>Online</div>
    </header>

    <!-- Upload / drop zone -->
    <section class="upload-bar" id="dropzone">
      <label class="file-label" for="file-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
        <span id="file-label-text">Choose file&hellip;</span>
        <input type="file" id="file-input" accept=".pdf,.txt,.md,.markdown" />
      </label>
      <button id="file-clear" class="file-clear" type="button" hidden aria-label="Remove selected file">&times;</button>
      <button id="upload-btn" type="button" disabled>Upload</button>
      <span id="upload-status" class="upload-status"></span>
      <span class="drop-hint">or drag &amp; drop here</span>
    </section>

    <!-- Chat area -->
    <main id="chat" class="chat" aria-live="polite">
      <div class="empty-state">
        <div class="empty-icon" aria-hidden="true">✨</div>
        <h2>Ask anything about your files</h2>
        <p>Upload a document above to grow your knowledge base,<br />then start the conversation.</p>
      </div>
    </main>

    <!-- Message input -->
    <form id="chat-form" class="chat-form">
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <input
          id="chat-input"
          type="text"
          placeholder="Ask a question about your uploaded files&hellip;"
          autocomplete="off"
          required
        />
      </div>
      <button id="send-btn" type="submit" aria-label="Send message">
        <span>Send</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
